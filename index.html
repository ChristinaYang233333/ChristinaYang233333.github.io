---
# 1. 切换为 So Simple 的 home 布局
layout: home

# 2. 配置 home 布局特有参数
entries_layout: list   # 文章展示样式：list (单列列表) 或 grid (多格卡片)
posts_limit: 5         # 未开启分页时，首页展示的最新文章数量
# paginate: true       # 如需开启分页可解开此行注释
---

<!-- 全屏开屏闪出黑幕容器 (通过 fixed 悬浮在 home 布局最上方) -->
<div id="splash-screen" style="
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: #050814; z-index: 99999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: opacity 1.2s ease-out;
    pointer-events: auto;
">
    <div id="quote-text" style="
        font-size: 1.4rem; max-width: 80%; text-align: center;
        opacity: 0; transition: opacity 1.2s ease-in; line-height: 1.8; letter-spacing: 1px;
    "></div>
    <div id="quote-date" style="
        font-size: 0.9rem; color: #8B949E; margin-top: 20px;
        opacity: 0; transition: opacity 1.2s ease-in;
    "></div>
</div>

<!-- 开屏闪出逻辑控制脚本 -->
<script>
(function() {
    let quotes = [];
    {% if site.data.highlights %}
      quotes = {{ site.data.highlights | jsonify }};
    {% endif %}

    if (!quotes || quotes.length === 0) {
        quotes = [{
            "text": "写小说最难的其实不是搭建世界观框架，而是如何让角色在日常不经意的对话中，自然地长出血肉。",
            "date": "2026-09-18"
        }];
    }

    const selected = quotes[Math.floor(Math.random() * quotes.length)];
    
    window.addEventListener('DOMContentLoaded', function() {
        const textEl = document.getElementById('quote-text');
        const dateEl = document.getElementById('quote-date');
        const splashEl = document.getElementById('splash-screen');

        if (textEl && dateEl && splashEl) {
            textEl.innerText = "「 " + selected.text + " 」";
            dateEl.innerText = "—— " + selected.date;

            setTimeout(function() {
                textEl.style.opacity = '1';
                dateEl.style.opacity = '1';
            }, 200);

            // 3.5秒后黑幕淡出，无缝露出底层的 So Simple home 页面
            setTimeout(function() {
                splashEl.style.opacity = '0';
                splashEl.style.pointerEvents = 'none';
                setTimeout(function() {
                    splashEl.style.display = 'none';
                }, 1200);
            }, 3500);
        }
    });
})();
</script>

# ==========================================================================
# 站点基础信息
# ==========================================================================
title: "Christina的数字花园"
description: "记录日常不经意的对话与思考脉络，在海量数据中寻找思绪微光。"
url: "https://christinayxr.com"
baseurl: ""

# ==========================================================================
# 作者信息
# ==========================================================================
author:
  name: "Christina"
  picture: "" 
  bio: "小说作者 / 数据拾荒者"

# ==========================================================================
# 远程主题设置 (关键修正)
# ==========================================================================
# 移除原有的 theme: so-simple-theme，改用 GitHub 仓库路径格式：作者名/仓库名
remote_theme: mmistakes/so-simple-theme

# 激活顶部菜单栏
navigation_header: main

# ==========================================================================
# 插件配置
# ==========================================================================
plugins:
  - jekyll-remote-theme # 必须显式声明加载远程主题插件
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# 排除不需要编译的系统文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

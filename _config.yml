# ==========================================================================
# 站点基础信息
# ==========================================================================
title: "Christina's数字花园"
description: "记录日常不经意的对话与思考脉络，在海量数据中寻找思绪微光。"
url: "https://christinayxr.com"
logo: "/images/logo.png"
baseurl: ""

# ==========================================================================
# 远程主题配置 (核心修正：GitHub Pages 托管必须启用 remote_theme)
# ==========================================================================
remote_theme: mmistakes/so-simple-theme
skin: "/assets/css/skins/default.css"
locale: zh-CN
date_format: "%Y-%m-%d"


# ==========================================================================
# 作者信息
# ==========================================================================
author:
  name: "Christina"
  picture: ""
  bio: "小说作者 / 数据拾荒者"

# ==========================================================================
# 构建与插件设置
# ==========================================================================
permalink: /:categories/:title/
markdown: kramdown
feed:
  path: atom.xml

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# 排除不需要编译的配置文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# ==========================================================================
# 站点基础信息
# ==========================================================================
title: "Christina的数字花园"
description: "记录日常不经意的对话与思考脉络，在海量数据中寻找思绪微光。"
url: "https://christinayxr.com"
baseurl: ""

# ==========================================================================
# 作者信息
# ==========================================================================
author:
  name: "Christina"
  # 如果你有头像图片，可以上传到 images 文件夹并在这里填入路径，如 "/images/avatar.png"
  picture: "" 
  bio: "小说作者 / 数据拾荒者"

# ==========================================================================
# 主题与外观设置
# ==========================================================================
# 保持你现有的 So Simple 主题
theme: so-simple-theme

# 关键设置：激活顶部菜单栏！
# 这里告诉主题去读取 _data/navigation.yml 文件里名为 "main" 的列表
navigation_header: main

# ==========================================================================
# 插件配置 (GitHub Pages 默认推荐)
# ==========================================================================
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# 排除不需要编译的系统文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
